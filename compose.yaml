services:
  sentineldesk:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SENTINEL_DEMO_MODE: "1"
      SENTINEL_DB_PATH: /data/sentinel.sqlite
    volumes:
      - sentinel_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  sentinel_data: