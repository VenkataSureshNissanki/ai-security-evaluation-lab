name: SentinelDesk security regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated API, agent and security tests
        run: python scripts/build_report.py
      - name: Upload reproducible test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentineldesk-security-report
          path: |
            reports/junit.xml
            reports/security-summary.html
          if-no-files-found: warn